name: CI
on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    merge_group:
        types:
            - checks_requested

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Lint files
              run: yarn lint

            - name: Typecheck files
              run: yarn typecheck

    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Run unit tests
              run: yarn test --maxWorkers=2 --coverage --watchman=false

    build-library:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Build package
              run: yarn prepare

    expo-prebuild:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                engine: [native, zig]
        env:
            EXPO_WORK_DIR: ${{ github.workspace }}/.tmp/expo-prebuild-${{ matrix.engine }}

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Expo prebuild smoke test (${{ matrix.engine }} engine)
              env:
                  ZFH_ENGINE: ${{ matrix.engine }}
              run: |
                  set -euo pipefail

                  PACKAGE_TGZ="$(npm pack --silent --ignore-scripts | tail -n1)"
                  rm -rf "$EXPO_WORK_DIR"
                  mkdir -p "$EXPO_WORK_DIR"

                  npx --yes create-expo-app@latest "$EXPO_WORK_DIR/app" --template blank-typescript --yes --no-install

                  cd "$EXPO_WORK_DIR/app"
                  npm install
                  npm install --ignore-scripts "$GITHUB_WORKSPACE/$PACKAGE_TGZ"

                  node <<'NODE'
                  const fs = require('node:fs');
                  const path = 'app.json';
                  const app = JSON.parse(fs.readFileSync(path, 'utf8'));
                  app.expo = app.expo || {};
                  app.expo.plugins = [
                    ['@preeternal/react-native-file-hash', { engine: process.env.ZFH_ENGINE }],
                  ];
                  fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
                  NODE

                  CI=1 npx expo config --json > "$EXPO_WORK_DIR/expo-config.json"
                  node -e "JSON.parse(require(\"node:fs\").readFileSync(process.argv[1], \"utf8\"))" "$EXPO_WORK_DIR/expo-config.json"

                  CI=1 npx expo prebuild --platform all --clean --no-install 2>&1 | tee "$EXPO_WORK_DIR/prebuild.log"

                  grep -q "^react_native_file_hash_engine=${ZFH_ENGINE}$" android/gradle.properties
                  grep -q "ENV\\['ZFH_ENGINE'\\] ||= '${ZFH_ENGINE}'" ios/Podfile

            - name: Print Expo prebuild diagnostics (${{ matrix.engine }})
              if: always()
              run: |
                  set -euo pipefail

                  echo "::group::app.json"
                  if [[ -f "$EXPO_WORK_DIR/app/app.json" ]]; then
                    cat "$EXPO_WORK_DIR/app/app.json"
                  else
                    echo "Missing: $EXPO_WORK_DIR/app/app.json"
                  fi
                  echo "::endgroup::"

                  echo "::group::expo config"
                  if [[ -f "$EXPO_WORK_DIR/expo-config.json" ]]; then
                    cat "$EXPO_WORK_DIR/expo-config.json"
                  else
                    echo "Missing: $EXPO_WORK_DIR/expo-config.json"
                  fi
                  echo "::endgroup::"

                  echo "::group::android/gradle.properties"
                  if [[ -f "$EXPO_WORK_DIR/app/android/gradle.properties" ]]; then
                    cat "$EXPO_WORK_DIR/app/android/gradle.properties"
                  else
                    echo "Missing: $EXPO_WORK_DIR/app/android/gradle.properties"
                  fi
                  echo "::endgroup::"

                  echo "::group::ios/Podfile engine lines"
                  if [[ -f "$EXPO_WORK_DIR/app/ios/Podfile" ]]; then
                    grep -n "ZFH_ENGINE" "$EXPO_WORK_DIR/app/ios/Podfile" || true
                  else
                    echo "Missing: $EXPO_WORK_DIR/app/ios/Podfile"
                  fi
                  echo "::endgroup::"

            - name: Upload Expo prebuild diagnostics (${{ matrix.engine }})
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: expo-prebuild-${{ matrix.engine }}-diagnostics
                  if-no-files-found: warn
                  path: |
                      ${{ env.EXPO_WORK_DIR }}/prebuild.log
                      ${{ env.EXPO_WORK_DIR }}/app/app.json
                      ${{ env.EXPO_WORK_DIR }}/expo-config.json
                      ${{ env.EXPO_WORK_DIR }}/app/android/gradle.properties
                      ${{ env.EXPO_WORK_DIR }}/app/ios/Podfile

            - name: Cleanup Expo prebuild workspace (${{ matrix.engine }})
              if: always()
              run: rm -rf "$EXPO_WORK_DIR"

    verify-packaged-artifacts:
        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Install Zig
              uses: ./.github/actions/setup-zig

            - name: Build Zig prebuilts for Android
              run: ./scripts/build-zig-android.sh

            - name: Build Zig prebuilts for iOS
              run: ./scripts/build-zig-ios.sh

            - name: Build Zig prebuilts for macOS
              run: ./scripts/build-zig-macos.sh

            - name: Build Zig prebuilts for Windows
              run: ./scripts/build-zig-windows.sh

            - name: Build package
              run: yarn prepare

            - name: Verify packaged artifacts
              run: yarn check:packaged-artifacts

    build-android:
        runs-on: ubuntu-latest

        env:
            TURBO_CACHE_DIR: .turbo/android

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Cache turborepo for Android
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: ${{ env.TURBO_CACHE_DIR }}
                  key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock', 'turbo.json', '.gitmodules') }}
                  restore-keys: |
                      ${{ runner.os }}-turborepo-android-

            - name: Check turborepo cache for Android
              run: |
                  TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

                  if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
                    echo "turbo_cache_hit=1" >> $GITHUB_ENV
                  fi

            - name: Install JDK
              if: env.turbo_cache_hit != 1
              uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
              with:
                  distribution: 'zulu'
                  java-version: '17'

            - name: Finalize Android SDK
              if: env.turbo_cache_hit != 1
              run: |
                  /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

            - name: Cache Gradle
              if: env.turbo_cache_hit != 1
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: |
                      ~/.gradle/wrapper
                      ~/.gradle/caches
                  key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Build example for Android
              env:
                  JAVA_OPTS: '-XX:MaxHeapSize=6g'
              run: |
                  yarn turbo run build:android --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

            - name: Verify 16KB page alignment
              run: bash scripts/check-16kb.sh

    test-android-native-jvm:
        runs-on: ubuntu-latest

        env:
            ORG_GRADLE_PROJECT_react_native_file_hash_engine: native

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Install JDK
              uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
              with:
                  distribution: 'zulu'
                  java-version: '17'

            - name: Finalize Android SDK
              run: |
                  /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

            - name: Cache Gradle
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: |
                      ~/.gradle/wrapper
                      ~/.gradle/caches
                  key: ${{ runner.os }}-gradle-jvm-tests-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-jvm-tests-
                      ${{ runner.os }}-gradle-

            - name: Run Android JVM unit tests (native engine)
              run: |
                  cd example/android
                  ./gradlew :preeternal_react-native-file-hash:testDebugUnitTest --no-daemon --console=plain -Preact_native_file_hash_engine=native

    build-android-zig:
        runs-on: ubuntu-latest

        env:
            TURBO_CACHE_DIR: .turbo/android-zig
            ORG_GRADLE_PROJECT_react_native_file_hash_engine: zig

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Cache turborepo for Android (zig)
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: ${{ env.TURBO_CACHE_DIR }}
                  key: ${{ runner.os }}-turborepo-android-zig-${{ hashFiles('yarn.lock', 'turbo.json', '.gitmodules') }}
                  restore-keys: |
                      ${{ runner.os }}-turborepo-android-zig-

            - name: Check turborepo cache for Android (zig)
              run: |
                  TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

                  if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
                    echo "turbo_cache_hit=1" >> $GITHUB_ENV
                  fi

            - name: Install JDK
              if: env.turbo_cache_hit != 1
              uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
              with:
                  distribution: 'zulu'
                  java-version: '17'

            - name: Install Zig
              if: env.turbo_cache_hit != 1
              uses: ./.github/actions/setup-zig

            - name: Finalize Android SDK
              if: env.turbo_cache_hit != 1
              run: |
                  /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

            - name: Cache Gradle
              if: env.turbo_cache_hit != 1
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: |
                      ~/.gradle/wrapper
                      ~/.gradle/caches
                  key: ${{ runner.os }}-gradle-zig-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-zig-
                      ${{ runner.os }}-gradle-

            - name: Build Zig prebuilts for Android
              if: env.turbo_cache_hit != 1
              run: ./scripts/build-zig-android.sh

            - name: Build example for Android (zig)
              env:
                  JAVA_OPTS: '-XX:MaxHeapSize=6g'
              run: |
                  yarn turbo run build:android --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

            - name: Verify 16KB page alignment (zig)
              run: bash scripts/check-16kb.sh

    build-ios:
        runs-on: macos-latest

        env:
            XCODE_VERSION: 26
            TURBO_CACHE_DIR: .turbo/ios
            RCT_USE_RN_DEP: 1
            RCT_USE_PREBUILT_RNCORE: 1

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Cache turborepo for iOS
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: ${{ env.TURBO_CACHE_DIR }}
                  key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock', 'turbo.json', '.gitmodules') }}
                  restore-keys: |
                      ${{ runner.os }}-turborepo-ios-

            - name: Check turborepo cache for iOS
              run: |
                  TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

                  if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
                    echo "turbo_cache_hit=1" >> $GITHUB_ENV
                  fi

            - name: Use appropriate Xcode version
              if: env.turbo_cache_hit != 1
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: ${{ env.XCODE_VERSION }}

            - name: Run native Swift unit tests
              run: |
                  CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/clang-module-cache" \
                  SWIFT_MODULECACHE_PATH="$RUNNER_TEMP/swift-module-cache" \
                  FILE_HASH_SWIFT_TESTS=1 \
                  swift test

            - name: Install cocoapods
              if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
              run: |
                  cd example
                  bundle install
                  bundle exec pod repo update --verbose
                  bundle exec pod install --project-directory=ios

            - name: Build example for iOS
              run: |
                  yarn turbo run build:ios --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

    build-ios-spm:
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                engine: [native, zig]

        env:
            XCODE_VERSION: 26
            RCT_USE_RN_DEP: 1
            RCT_USE_PREBUILT_RNCORE: 1

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Use appropriate Xcode version
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: ${{ env.XCODE_VERSION }}

            - name: Cache React Native SwiftPM artifacts (${{ matrix.engine }})
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: ~/Library/Caches/ReactNative/spm-artifacts
                  key: ${{ runner.os }}-react-native-spm-${{ matrix.engine }}-${{ hashFiles('example/package.json', 'Package.swift', 'yarn.lock', '.yarn/patches/**') }}
                  restore-keys: |
                      ${{ runner.os }}-react-native-spm-${{ matrix.engine }}-

            - name: Install CocoaPods
              run: |
                  cd example
                  bundle install
                  bundle exec pod repo update --verbose
                  bundle exec pod install --project-directory=ios

            - name: Set up SwiftPM
              run: |
                  plutil -insert ZFHEngine -string "${{ matrix.engine }}" \
                    example/ios/FileHashExample/Info.plist
                  cd example
                  bundle exec pod deintegrate ios/FileHashExample.xcodeproj
                  npx react-native spm add --yes

            - name: Build example for iOS with SwiftPM (${{ matrix.engine }})
              run: |
                  IOS_BUILD_LOG="$RUNNER_TEMP/ios-spm-${{ matrix.engine }}-build.log"
                  if ! xcodebuild \
                    -project example/ios/FileHashExample.xcodeproj \
                    -scheme FileHashExample \
                    -configuration Debug \
                    -sdk iphonesimulator \
                    -destination 'generic/platform=iOS Simulator' \
                    -derivedDataPath example/ios/build/DerivedData \
                    COMPILER_INDEX_STORE_ENABLE=NO \
                    DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING=YES \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    build 2>&1 | tee "$IOS_BUILD_LOG"; then
                    grep -n -m 30 -E 'error:|fatal error:' "$IOS_BUILD_LOG" || true
                    exit 1
                  fi

            - name: Verify SwiftPM integration (${{ matrix.engine }})
              run: |
                  test -f example/ios/FileHashExample.xcodeproj/.spm-injected.json
                  test -f example/ios/ReactNativeSPM/ReactNativeSPM.xcconfig
                  test -f example/ios/ReactNativeSPM/Scripts/sync-autolinking.sh
                  test -f example/ios/ReactNativeSPM/Scripts/embed-flavored-frameworks.sh


    build-macos-example:
        runs-on: macos-latest

        env:
            XCODE_VERSION: 26

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Test smoke runner
              run: node --test scripts/__tests__/run-macos-smoke.test.cjs

            - name: Use appropriate Xcode version
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: ${{ env.XCODE_VERSION }}

            - name: Install Zig
              uses: ./.github/actions/setup-zig

            - name: Build Zig prebuilt for macOS
              run: ./scripts/build-zig-macos.sh

            - name: Install CocoaPods
              working-directory: examples/macos
              run: |
                  bundle install
                  bundle exec pod install --project-directory=macos

            - name: Build package
              run: yarn prepare

            - name: Build macOS Release smoke bundle
              working-directory: examples/macos/macos
              run: |
                  set -o pipefail
                  xcodebuild \
                    -workspace FileHashMacOSExample.xcworkspace \
                    -scheme FileHashMacOSExample-macOS \
                    -configuration Release \
                    -sdk macosx \
                    -derivedDataPath "$RUNNER_TEMP/file-hash-macos-derived" \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    ENTRY_FILE=index.smoke.tsx \
                    BUNDLE_NAME=main.smoke \
                    build 2>&1 | tee "$RUNNER_TEMP/macos-build.log"

            - name: Run Release JS hash smoke test
              working-directory: examples/macos/macos
              run: |
                  set -euo pipefail
                  app_binary="$RUNNER_TEMP/file-hash-macos-derived/Build/Products/Release/FileHashMacOSExample.app/Contents/MacOS/FileHashMacOSExample"
                  smoke_log="$RUNNER_TEMP/macos-smoke.log"

                  bash ../../../scripts/run-macos-smoke.sh "$app_binary" "$smoke_log"

            - name: Upload macOS diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: macos-example-diagnostics
                  if-no-files-found: warn
                  path: |
                      ${{ runner.temp }}/macos-build.log
                      ${{ runner.temp }}/macos-smoke.log

    build-windows-example:
        runs-on: windows-2025-vs2026

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Install Zig
              uses: ./.github/actions/setup-zig

            - name: Typecheck Windows example
              run: yarn workspace @preeternal/react-native-file-hash-windows-example typecheck

            - name: Build Zig prebuilt for Windows
              shell: bash
              run: ./scripts/build-zig-windows.sh

            - name: Build package
              run: yarn prepare

            - name: Build Windows Release smoke bundle
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
                  $sdkVersion = Get-ChildItem (Join-Path $kitsRoot 'Include') -Directory |
                      Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } |
                      Where-Object {
                          [version]$_.Name -ge [version]'10.0.22621.0' -and
                          (Test-Path (Join-Path $_.FullName 'um\Windows.h')) -and
                          (Test-Path (Join-Path $kitsRoot "Lib\$($_.Name)\um\x64\kernel32.lib")) -and
                          (Test-Path (Join-Path $kitsRoot "Lib\$($_.Name)\ucrt\x64\ucrt.lib"))
                      } |
                      Sort-Object { [version]$_.Name } -Descending |
                      Select-Object -First 1 -ExpandProperty Name
                  if (-not $sdkVersion) { throw 'No complete x64 Windows SDK >= 10.0.22621.0 is installed' }
                  Write-Host "Using Windows SDK $sdkVersion"
                  $msbuildProps = "BundleEntryFile=index.smoke.windows.tsx,WindowsTargetPlatformVersion=$sdkVersion,TargetPlatformVersion=$sdkVersion"

                  $env:FILE_HASH_WINDOWS_SMOKE_LOG = Join-Path $env:RUNNER_TEMP 'windows-smoke.log'
                  Remove-Item $env:FILE_HASH_WINDOWS_SMOKE_LOG -ErrorAction SilentlyContinue
                  yarn workspace @preeternal/react-native-file-hash-windows-example windows --release --arch x64 --no-deploy --no-packager --msbuildprops $msbuildProps

            - name: Run Release JS hash smoke test
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $env:FILE_HASH_WINDOWS_SMOKE_LOG = Join-Path $env:RUNNER_TEMP 'windows-smoke.log'
                  $app = Get-ChildItem 'examples/windows/windows' -Filter 'FileHashWindowsExample.exe' -Recurse -File |
                      Where-Object { $_.FullName -match '[\\/]x64[\\/]Release[\\/]' } |
                      Select-Object -First 1
                  if (-not $app) { throw 'Could not locate Release app executable' }

                  $process = Start-Process -FilePath $app.FullName -PassThru
                  if (-not $process.WaitForExit(180000)) {
                      $process.Kill()
                      throw 'Windows hash smoke timed out after 180 seconds'
                  }
                  if (-not (Test-Path $env:FILE_HASH_WINDOWS_SMOKE_LOG)) { throw 'Smoke app did not write a log' }
                  Get-Content $env:FILE_HASH_WINDOWS_SMOKE_LOG
                  if ($process.ExitCode -ne 0) { throw "Smoke app exited with code $($process.ExitCode)" }
                  if (-not (Select-String -Path $env:FILE_HASH_WINDOWS_SMOKE_LOG -Pattern 'FILE_HASH_WINDOWS_SMOKE_PASS' -Quiet)) {
                      throw 'Smoke app exited without a PASS marker'
                  }

            - name: Upload Windows diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-example-diagnostics
                  if-no-files-found: warn
                  path: |
                      ${{ runner.temp }}/windows-smoke.log
                      examples/windows/windows/**/msbuild*.err
                      examples/windows/windows/**/msbuild*.wrn
                      examples/windows/windows/**/msbuild*.binlog

    build-ios-zig:
        runs-on: macos-latest

        env:
            XCODE_VERSION: 26
            TURBO_CACHE_DIR: .turbo/ios-zig
            RCT_USE_RN_DEP: 1
            RCT_USE_PREBUILT_RNCORE: 1
            ZFH_ENGINE: zig

        steps:
            - name: Checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

            - name: Setup
              uses: ./.github/actions/setup

            - name: Cache turborepo for iOS (zig)
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: ${{ env.TURBO_CACHE_DIR }}
                  key: ${{ runner.os }}-turborepo-ios-zig-${{ hashFiles('yarn.lock', 'turbo.json', '.gitmodules') }}
                  restore-keys: |
                      ${{ runner.os }}-turborepo-ios-zig-

            - name: Check turborepo cache for iOS (zig)
              run: |
                  TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

                  if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
                    echo "turbo_cache_hit=1" >> $GITHUB_ENV
                  fi

            - name: Use appropriate Xcode version
              if: env.turbo_cache_hit != 1
              uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
              with:
                  xcode-version: ${{ env.XCODE_VERSION }}

            - name: Install Zig
              if: env.turbo_cache_hit != 1
              uses: ./.github/actions/setup-zig

            - name: Build Zig prebuilts for iOS
              if: env.turbo_cache_hit != 1
              run: ./scripts/build-zig-ios.sh

            - name: Install cocoapods
              if: env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
              run: |
                  cd example
                  bundle install
                  bundle exec pod repo update --verbose
                  bundle exec pod install --project-directory=ios

            - name: Build example for iOS (zig)
              run: |
                  yarn turbo run build:ios --filter=@preeternal/react-native-file-hash-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"
