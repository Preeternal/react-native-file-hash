name: Setup Zig
description: Download Zig and add it to PATH

inputs:
    version:
        description: Zig version to install
        required: false
        default: '0.17.1'

runs:
    using: composite
    steps:
        - name: Install Zig
          shell: bash
          run: |
              set -euo pipefail

              ZIG_VERSION="${{ inputs.version }}"

              if [[ "${{ runner.os }}" == "macOS" && "$ZIG_VERSION" == "0.15.2" ]]; then
                brew install zig@0.15
                echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
                exit 0
              fi

              case "${{ runner.os }}" in
                Linux)
                  ARCHIVE_CANDIDATES=(
                    "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
                    "zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
                  )
                  ;;
                macOS)
                  ARCH="$(uname -m)"
                  if [[ "$ARCH" == "arm64" ]]; then
                    ARCHIVE_CANDIDATES=(
                      "zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
                      "zig-macos-aarch64-${ZIG_VERSION}.tar.xz"
                    )
                  else
                    ARCHIVE_CANDIDATES=(
                      "zig-x86_64-macos-${ZIG_VERSION}.tar.xz"
                      "zig-macos-x86_64-${ZIG_VERSION}.tar.xz"
                    )
                  fi
                  ;;
                Windows)
                  ARCHIVE_CANDIDATES=(
                    "zig-x86_64-windows-${ZIG_VERSION}.zip"
                    "zig-windows-x86_64-${ZIG_VERSION}.zip"
                  )
                  ;;
                *)
                  echo "Unsupported runner OS: ${{ runner.os }}" >&2
                  exit 1
                  ;;
              esac

              ARCHIVE_PATH="$RUNNER_TEMP/zig.tar.xz"
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                ARCHIVE_PATH="$RUNNER_TEMP/zig.zip"
              fi
              rm -f "$ARCHIVE_PATH"
              ZIG_URL=""
              for archive in "${ARCHIVE_CANDIDATES[@]}"; do
                candidate_url="https://ziglang.org/download/${ZIG_VERSION}/${archive}"
                echo "Trying Zig URL: $candidate_url"
                if curl -fL --retry 3 "$candidate_url" -o "$ARCHIVE_PATH"; then
                  ZIG_URL="$candidate_url"
                  break
                fi
                rm -f "$ARCHIVE_PATH"
              done

              if [[ -z "$ZIG_URL" ]]; then
                echo "Failed to download Zig ${ZIG_VERSION} for ${{ runner.os }}" >&2
                exit 1
              fi

              echo "Using Zig archive: $ZIG_URL"
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                mkdir -p "$RUNNER_TEMP/zig"
                pwsh -NoProfile -Command 'Expand-Archive -LiteralPath "$env:RUNNER_TEMP/zig.zip" -DestinationPath "$env:RUNNER_TEMP/zig-archive" -Force; $root = Get-ChildItem "$env:RUNNER_TEMP/zig-archive" | Select-Object -First 1; Copy-Item "$($root.FullName)\*" "$env:RUNNER_TEMP/zig" -Recurse -Force'
              else
                mkdir -p "$RUNNER_TEMP/zig"
                tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
              fi
              echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

        - name: Verify Zig
          shell: bash
          run: zig version
